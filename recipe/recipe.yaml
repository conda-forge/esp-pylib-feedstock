context:
  version: "1.2.1"

package:
  name: esp-pylib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/esp_pylib/esp_pylib-${{ version }}.tar.gz
  sha256: c0854cc57b86e2745e9f7ac820d5d5e8a9f2c2d93caf12623c419b8d08d852f6

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=64
    - wheel
  run:
    - click >=8.0,<9
    - pyserial >=3.3
    - python >=${{ python_min }}
    - rich
    - rich-click >=1.7,<2
    - websockets >=12.0

tests:
  - python:
      imports:
        - esp_pylib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/espressif/esp-pylib
  summary: 'Python library for logging, utils and constants for Espressif Systems Python projects'
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/espressif/esp-pylib

extra:
  recipe-maintainers:
    - m-rossi
